    <style>
        body {
            font-family: "Playfair Display", "Times New Roman", serif;
            background-color: #ffffff;
        }
        
        /* Mengubah warna dasar navbar abu-abu default menjadi putih bersih tanpa border */
        .navbar-default {
            background-color:#e3e2e2;
            border: none;
            padding-top: 20px;
            padding-bottom: 10px;
            margin-bottom: 0;
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 22px;
            color: #000000 !important;
        }
        .navbar-nav li a {
            color: #444444 !important;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            background: transparent;
            border: 1px solid #ebd9d9;
            color: #999999;
            border-radius: 10px;
            padding: 5px 20px;
            margin: 0 6px;
            font-size: 11px;
            transition: all 0.2s;
        }
        
        /* Hero Section Teks di Tengah */
        .hero-section {
            padding-top: 40px;
            padding-bottom: 20px;
        }
        .hero-section h2 {
            font-weight: bold;
            font-size: 32px;
            margin-bottom: 12px;
        }
        .hero-section h4 {
            font-weight: bold;
            color: #222222;
            margin-bottom: 15px;
        }
        .hero-section .text-muted {
            font-size: 11px;
            letter-spacing: 3px;
            color: #c0c0c0;
            text-transform: uppercase;
        }
        
        /* Kustomisasi gaya tombol agar membulat elips tipis */
        .filter-buttons {
            margin-top: 80px;
            margin-bottom: 5px;
        }
        
        .btn-custom {
            background: transparent;
            padding-left: 30px;
            padding-right: 30px;
        }

        .btn-custom:hover {
            background: transparent;
            border: 1px solid #ebd9d9;
            color: #999999;
            border-radius: 20px;
            padding: 5px 20px;
            margin: 0 6px;
            font-size: 11px;
            transition: all 0.2s;
        }
        
        /* Mengatur kerapatan dan jarak kotak gambar */
        .gallery-container {
            padding-left: 5px;
            padding-right: 5px;
        }
        .gallery-col img {
        max-width: 80%;      /* Mengubah ukuran gambar menjadi lebih kecil (80% dari lebar kolom) */
        height: auto;        /* Memastikan tinggi gambar menyesuaikan secara proporsional */
        margin: 0 auto;      /* KUNCI: Membuat posisi gambar yang sudah diperkecil tetap di tengah */
        display: block;      /* Wajib ada agar margin: 0 auto bisa bekerja dengan sempurna */
        margin-bottom: 10px; /* Menambahkan jarak bawah antar gambar */
        }
    </style>
</head>

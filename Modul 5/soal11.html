<!DOCTYPE html>
<html>
<body>
    <h1>Latihan Javascript</h1>
    <p>Silahkan masukkan angka</p>
    
    <input id="demo" type="text">
    <button type="button" onclick="myFunction()">Cek Angka</button>

    <script>
        function myFunction() {
            var x = document.getElementById("demo").value;
            
            // Jika input kosong atau BUKAN sebuah angka (isNaN)
            if (x == "" || isNaN(x)) {
                alert("Bukan angka");
            } else {
                alert("Input valid (Angka)");
            }
        }
    </script>
</body>
</html>

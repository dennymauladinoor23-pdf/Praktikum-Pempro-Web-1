<!DOCTYPE html>
<html>
<body>
    <h1>Latihan javascript</h1>
    <p id="demo">
        Javascript bisa merubah isi dari elemen HTML 
    </p>
    <script>
        function myFunction() {
            var x = document.getElementById("demo");
            x.innerHTML = "Ini isi terbaru!";
        }
    </script>

    <button type="button" onclick="myFunction()">Click Me!</button>
</body>
</html>
